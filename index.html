<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vania Alicia Yocelin · Portfolio</title>
    <meta name="description" content="Portfolio of Vania Alicia Yocelin, Computer Science student at BINUS University with a background in graphic design." />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before the page paints (prevents a flash)
      try {
        var t = localStorage.getItem('vania-theme');
        if (t === 'dark' || t === 'sunset' || t === 'clean') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
